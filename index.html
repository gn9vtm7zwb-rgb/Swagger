<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWAGGER — Youngy Deey</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 18px;
      background:
        radial-gradient(circle at top, rgba(212,175,55,.16), transparent 35%),
        #050505;
    }

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .label {
      color: #d4af37;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .label-logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .artist {
      font-size: 18px;
      letter-spacing: 4px;
      color: #bdbdbd;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(58px, 15vw, 130px);
      line-height: .9;
      letter-spacing: -5px;
      color: #d4af37;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .release {
      color: #aaa;
      font-size: 15px;
      letter-spacing: 3px;
      margin-bottom: 28px;
    }

    .artwork {
      width: min(430px, 90vw);
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 2px solid #d4af37;
      box-shadow: 0 0 45px rgba(212,175,55,.18);
      margin: 0 auto 35px;
      display: block;
      background: #111;
    }

    .countdown-title {
      font-size: 13px;
      letter-spacing: 4px;
      color: #aaa;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .time-box {
      width: 95px;
      padding: 17px 8px;
      border: 1px solid #6f5a1c;
      background: #0d0d0d;
    }

    .number {
      display: block;
      color: #d4af37;
      font-size: 34px;
      font-weight: 800;
    }

    .unit {
      display: block;
      color: #888;
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    .listen {
      display: inline-block;
      padding: 16px 30px;
      background: #d4af37;
      color: #050505;
      text-decoration: none;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: .25s;
    }

    .listen:hover {
      background: #f0d477;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 45px;
      padding-top: 20px;
      border-top: 1px solid #222;
    }

    .footer-name {
      color: #d4af37;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .footer-text {
      color: #666;
      font-size: 11px;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    @media (max-width: 500px) {
      .time-box {
        width: 76px;
        padding: 14px 5px;
      }

      .number {
        font-size: 27px;
      }

      h1 {
        letter-spacing: -3px;
      }

      .artwork {
        margin-bottom: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <div class="container">

      <!-- RECORD LABEL LOGO -->
      <!-- Replace "label-logo.jpg" with your actual logo filename -->
      <img
        src="label-logo.jpg"
        alt="dęęÿmįñįøñ record label logo"
        class="label-logo"
      >

      <div class="label">dęęÿmįñįøñ</div>

      <div class="artist">Youngy Deey</div>

      <h1>Swagger</h1>

      <div class="release">
        OUT OCTOBER 16, 2026
      </div>

      <!-- SWAGGER ARTWORK -->
      <!-- Replace "swagger.jpg" with your Swagger artwork filename -->
      <img
        src="swagger.jpg"
        alt="Swagger single artwork"
        class="artwork"
      >

      <div class="countdown-title">
        Countdown to release
      </div>

      <div class="countdown">

        <div class="time-box">
          <span class="number" id="days">00</span>
          <span class="unit">DAYS</span>
        </div>

        <div class="time-box">
          <span class="number" id="hours">00</span>
          <span class="unit">HOURS</span>
        </div>

        <div class="time-box">
          <span class="number" id="minutes">00</span>
          <span class="unit">MINUTES</span>
        </div>

        <div class="time-box">
          <span class="number" id="seconds">00</span>
          <span class="unit">SECONDS</span>
        </div>

      </div>

      <!-- AUDIOMACK -->
      <a
        class="listen"
        href="https://audiomack.com/danielodivwri0"
        target="_blank"
        rel="noopener noreferrer"
      >
        🎧 Listen on Audiomack
      </a>

      <footer class="footer">
        <div class="footer-name">dęęÿmįñįøñ</div>
        <div class="footer-text">
          © 2026 YOUNGY DEEY — ALL RIGHTS RESERVED
        </div>
      </footer>

    </div>
  </main>

  <script>
    // Release date: October 16, 2026
    const releaseDate = new Date("2026-10-16T00:00:00+01:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = releaseDate - now;

      if (difference <= 0) {
        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";

        document.querySelector(".countdown-title").textContent =
          "SWAGGER IS OUT NOW 🔥";

        return;
      }

      const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
      );

      const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
      );

      const seconds = Math.floor(
        (difference / 1000) % 60
      );

      document.getElementById("days").textContent =
        String(days).padStart(2, "0");

      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
